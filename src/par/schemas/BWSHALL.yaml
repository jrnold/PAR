source: BWSHALL
dataset: BWSH-1993 (BWSHALL)
export: BWSHALL.csv
citation: |
  Dataset: BWSH-1993 (BWSHALL)
  Data From: Militar-Historisches Kriegslexicon (1618-1905)
  Author: Gaston Bodart
  Organization: C.W. Stern, publisher
  Address: Vienna and Leipzig
  Publication Date: 1908
  Classification: UNCLASSIFIED
  Source Available From: Libraries
  Prepared By: Dr. Robert L. Helmbold, US Army Concepts Analysis Agency
  Last Revised: 15 November 1993
tables:
  - name: bwshall
    title: Land battles, 1619 to 1905
    rows: [2, 1088]
    keys: [seq_no]
    checks:
      - {name: dates_ordered, expr: "start_date <= end_date"}
      - {name: duration, expr: "date_diff('day', start_date, end_date) + 1 = duration_days"}
      - {name: winner_bloody, expr: "winner_dead + winner_wounded = winner_bloody"}
      - {name: loser_bloody, expr: "loser_dead + loser_wounded = loser_bloody"}
      - {name: winner_losses, expr: "winner_bloody + winner_mia_pow = winner_losses"}
      - {name: loser_losses, expr: "loser_bloody + loser_mia_pow = loser_losses"}
      - {name: winner_loss_le_strength, expr: "winner_losses <= winner_strength"}
      - {name: loser_loss_le_strength, expr: "loser_losses <= loser_strength"}
    columns:
      - [0, seq_no, integer, Sequence number]
      - [1, page, integer, Source page]
      - [2, item, integer, Item number on the page]
      - [3, battle_type, string, Type of battle in the source]
      - [4, battle_name, string, Battle name]
      - [5, start_date, date, Start date]
      - [6, end_date, date, End date]
      - [7, duration_days, number, "Duration in days. The 2013 CSV mislabels this column 'Sequence No.'"]
      - [8, winner_a, string, Principal force component of the winner]
      - [9, winner_b, string, Secondary force component of the winner]
      - [10, loser_a, string, Principal force component of the loser]
      - [11, loser_b, string, Secondary force component of the loser]
      - [12, winner_strength, number, Winner initial strength]
      - [13, loser_strength, number, Loser initial strength]
      - [14, winner_dead, number, Winner dead]
      - [15, winner_wounded, number, Winner wounded]
      - [16, winner_bloody, number, Winner bloody losses]
      - [17, winner_mia_pow, number, Winner missing or captured]
      - [18, winner_losses, number, Winner total losses]
      - [19, loser_dead, number, Loser dead]
      - [20, loser_wounded, number, Loser wounded]
      - [21, loser_bloody, number, Loser bloody losses]
      - [22, loser_mia_pow, number, Loser missing or captured]
      - [23, loser_losses, number, Loser total losses]
