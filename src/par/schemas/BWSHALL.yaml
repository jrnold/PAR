source: BWSHALL
dataset: BWSH-1993 (BWSHALL)
sheet: BWSHALL.csv
citation_rows: [1, 10]
tables:
  - name: bwshall
    title: Land battles, 1619 to 1905
    rows: [16, 1102]
    keys: [seq_no]
    checks:
      - {name: dates_ordered, expr: "start_date <= end_date"}
      - {name: duration, expr: "date_diff('day', start_date, end_date) + 1 = duration_days"}
      - {name: winner_bloody, expr: "winner_dead + winner_wounded = winner_bloody"}
      - {name: loser_bloody, expr: "loser_dead + loser_wounded = loser_bloody"}
      - {name: winner_losses, expr: "winner_bloody + winner_mia_pow = winner_losses"}
      - {name: loser_losses, expr: "loser_bloody + loser_mia_pow = loser_losses"}
      - {name: winner_loss_le_strength, expr: "winner_losses <= winner_strength"}
      - {name: loser_loss_le_strength, expr: "loser_losses <= loser_strength"}
    columns:
      - [0, seq_no, integer, Sequence number]
      - [1, page, integer, Source page]
      - [2, item, integer, Item number on the page]
      - [3, battle_type, string, Type of battle in the source]
      - [4, battle_name, string, Battle name]
      - {parts: [5, 6, 7], name: start_date, type: date, description: Start date}
      - {parts: [8, 9, 10], name: end_date, type: date, description: End date}
      - [11, duration_days, number, Duration in days]
      - [12, winner_a, string, Principal force component of the winner]
      - [13, winner_b, string, Secondary force component of the winner]
      - [14, loser_a, string, Principal force component of the loser]
      - [15, loser_b, string, Secondary force component of the loser]
      - [16, winner_strength, number, Winner initial strength]
      - [17, loser_strength, number, Loser initial strength]
      - [18, winner_dead, number, Winner dead]
      - [19, winner_wounded, number, Winner wounded]
      - [20, winner_bloody, number, Winner bloody losses]
      - [21, winner_mia_pow, number, Winner missing or captured]
      - [22, winner_losses, number, Winner total losses]
      - [23, loser_dead, number, Loser dead]
      - [24, loser_wounded, number, Loser wounded]
      - [25, loser_bloody, number, Loser bloody losses]
      - [26, loser_mia_pow, number, Loser missing or captured]
      - [27, loser_losses, number, Loser total losses]
