      - [3, soviet_losses, number, Soviet losses]
      - [5, german_strength, number, German strength]
      - [6, german_losses, number, German losses]
      - [7, notes, string, Note marker]
      - [9, soviet_start, number, Soviet start strength]
      - [10, soviet_gain, number, Soviet gains]
      - [11, soviet_loss_calc, number, Soviet loss used in the balance]
      - [12, soviet_final, number, Soviet final strength]
      - [14, german_start, number, German start strength]
      - [15, german_gain, number, German gains]
