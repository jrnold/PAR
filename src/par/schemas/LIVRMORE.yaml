source: LIVRMORE
dataset: LIVRMORE-1993
sheet: LIVRMORE.csv
citation_rows: [1, 11]
notes_rows: [83, 86]
tables:
  - name: livrmore
    title: US Civil War battles, 1861 to 1865
    description: The sheet stores these dates as 1961 to 1965 because spreadsheets of the time couldn't hold dates before 1900. This table subtracts 100 years.
    rows: [18, 80]
    missing: [NA]
    date_year_offset: -100
    keys: [seq_no]
    checks:
      - {name: dates_ordered, expr: "start_date <= end_date"}
      - {name: attacker_kw, expr: "attacker_kia + attacker_wia = attacker_kw"}
      - {name: defender_kw, expr: "defender_kia + defender_wia = defender_kw"}
      - {name: wina_matches_side, expr: "(wina = 1) = (win_side = attacker) or win_side not in ('UNION', 'CONFEDERATE')"}
    columns:
      - [0, seq_no, integer, Sequence number]
      - [1, battle_name, string, Battle name]
      - [2, start_date, date, Start date]
      - [3, end_date, date, End date]
      - [4, attacker, string, Attacking side]
      - [5, attack_id_code, integer, 2 if the Union attacked and 1 if the Confederates attacked]
      - [6, attacker_strength, number, Attacker strength]
      - [7, attacker_kia, number, Attacker killed in action]
      - [8, attacker_wia, number, Attacker wounded in action]
      - [9, attacker_kw, number, Attacker killed and wounded]
      - [10, attacker_mia_pow, number, Attacker missing or captured]
      - [11, defender_strength, number, Defender strength]
      - [12, defender_kia, number, Defender killed in action]
      - [13, defender_wia, number, Defender wounded in action]
      - [14, defender_kw, number, Defender killed and wounded]
      - [15, defender_mia_pow, number, Defender missing or captured]
      - [16, wina, integer, +1 if the attacker won and -1 if the defender won]
      - [17, win_side, string, Winning side]
