source: LIVRMORE
dataset: LIVRMORE-1993
export: LIVRMORE.csv
citation: |
  Data From (Title): Numbers and Losses in the Civil War in America, 1861-65.
  Author: Livermore, Thomas L.
  Organization: Kraus Reprint Co.
  Address: Milwood, NY.
  Publication Date: 1977.
  Classification: UNCLASSIFIED.
  Source Available From: Libraries.
  Prepared By: Dr. Robert L. Helmbold, US Army Concepts Analysis Agency
  Spreadsheet last revised: 30 October 1993
notes: |
  When the number of KIA is not separately available, the values under WIA are KIA + WIA.
  ATK ID CODE = 2 if Union attacked, 1 if Confederates attacked.
  WINA = +1 if attacker won, -1 if defender won.
tables:
  - name: livrmore
    title: US Civil War battles, 1861 to 1865
    rows: [2, 64]
    keys: [seq_no]
    checks:
      - {name: dates_ordered, expr: "start_date <= end_date"}
      - {name: attacker_kw, expr: "attacker_kia + attacker_wia = attacker_kw"}
      - {name: defender_kw, expr: "defender_kia + defender_wia = defender_kw"}
      - {name: wina_matches_side, expr: "(wina = 1) = (win_side = attacker) or win_side not in ('UNION', 'CONFEDERATE')"}
    columns:
      - [0, seq_no, integer, Sequence number]
      - [1, battle_name, string, Battle name]
      - [2, start_date, date, Start date]
      - [3, end_date, date, End date]
      - [4, attacker, string, Attacking side]
      - [5, attacker_strength, number, Attacker strength]
      - [6, attacker_kia, number, Attacker killed in action]
      - [7, attacker_wia, number, Attacker wounded in action]
      - [8, attacker_kw, number, Attacker killed and wounded]
      - [9, attacker_mia_pow, number, Attacker missing or captured]
      - [10, defender_strength, number, Defender strength]
      - [11, defender_kia, number, Defender killed in action]
      - [12, defender_wia, number, Defender wounded in action]
      - [13, defender_kw, number, Defender killed and wounded]
      - [14, defender_mia_pow, number, Defender missing or captured]
      - [15, wina, integer, +1 if the attacker won and -1 if the defender won]
      - [16, win_side, string, Winning side]
