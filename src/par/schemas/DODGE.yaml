source: DODGE
dataset: DODGE-1993
export: DODGE.csv
citation: |
  Dataset: DODGE-1993
  Data From: "Napoleon: A History of the Art of War from Lutzen to Waterloo, With a Detailed Account of the Napoleonic Wars" (vol 4 of 4)
  Author: Dodge, Theodore Ayrault.
  Organization: AMS Press, Inc.
  Address: New York, NY 10003.
  Publication Date: 1970. (Reprinted from the edition of 1904-1907.)
  Classification: UNCLASSIFIED
  Sources Available From: Libraries
  Prepared By: Dr. Robert L. Helmbold, US Army Concepts Analysis Agency
  Last Revised: 11 January 1994
tables:
  - name: dodge
    title: Losses in selected battles, 1631 to 1815
    rows: [2, 262]
    description: Ditto marks in the source's date columns are filled from the row above.
    keys: [seq_no]
    checks:
      - {name: start_ordered, expr: "start_date_min <= start_date_max"}
      - {name: end_ordered, expr: "end_date_min <= end_date_max"}
      - {name: start_before_end, expr: "start_date_min <= end_date_max"}
      - {name: casualties_le_engaged, expr: "casualties <= number_engaged"}
    columns:
      - [0, seq_no, integer, Sequence number]
      - [1, page, integer, Source page]
      - [2, battle_name, string, Battle name]
      - {col: 3, name: start_date_min, type: date, ditto: '"-"-"', description: "Start date (earliest if uncertain)"}
      - {col: 4, name: start_date_max, type: date, ditto: '"-"-"', description: "Start date (latest if uncertain). The 2013 CSV header repeated start_date_min"}
      - {col: 5, name: end_date_min, type: date, ditto: '"-"-"', description: "End date (earliest if uncertain)"}
      - {col: 6, name: end_date_max, type: date, ditto: '"-"-"', description: "End date (latest if uncertain). The 2013 CSV header repeated end_date_min"}
      - [7, nationality, string, Nationality]
      - [8, number_engaged, number, Number engaged]
      - [9, casualties, number, Casualties]
      - [10, casualty_type, string, Casualty type (Killed or Bloody)]
      - [11, notes, string, Notes]
