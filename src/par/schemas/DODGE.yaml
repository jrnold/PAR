source: DODGE
dataset: DODGE-1993
sheet: DODGE.csv
citation_rows: [1, 12]
tables:
  - name: dodge
    title: Losses in selected battles, 1631 to 1815
    rows: [17, 277]
    description: "Ditto marks in the source's name and date columns are filled from the row above. Where the source gives no day, the *_min date is the first of the month and the *_max date the last."
    keys: [seq_no]
    checks:
      - {name: start_ordered, expr: "start_date_min <= start_date_max"}
      - {name: end_ordered, expr: "end_date_min <= end_date_max"}
      - {name: start_before_end, expr: "start_date_min <= end_date_max"}
      - {name: casualties_le_engaged, expr: "casualties <= number_engaged"}
    columns:
      - [0, seq_no, integer, Sequence number]
      - [1, page, integer, Source page]
      - {col: 2, name: battle_name, type: string, ditto: '"', description: Battle name}
      - {parts: [3, 4, 5], partial: first, name: start_date_min, type: date, ditto: '"-"-"', description: "Start date (earliest if uncertain)"}
      - {parts: [3, 4, 5], partial: last, name: start_date_max, type: date, ditto: '"-"-"', description: "Start date (latest if uncertain)"}
      - {parts: [6, 7, 8], partial: first, name: end_date_min, type: date, ditto: '"-"-"', description: "End date (earliest if uncertain)"}
      - {parts: [6, 7, 8], partial: last, name: end_date_max, type: date, ditto: '"-"-"', description: "End date (latest if uncertain)"}
      - [9, nationality, string, Nationality]
      - [10, number_engaged, number, Number engaged]
      - [11, casualties, number, Casualties]
      - [12, casualty_type, string, Casualty type (Killed or Bloody)]
      - [13, notes, string, Notes]
