source: CRETE
dataset: CRETE-1993
sheet: CRETE.csv
citation_rows: [1, 11]
notes_rows: [36, 40]
tables:
  - name: crete
    title: Battle of Crete daily strengths and losses
    description: >-
      Engel's model values. The loss and survivor columns are iterative formulas; these are the
      results stored in the sheet.
    rows: [16, 29]
    keys: [day_number]
    columns:
      - [0, day_number, integer, Day number]
      - [3, d_day_plus, integer, Day relative to D-Day]
      - [4, german_landings, number, German personnel landed on the day]
      - [5, german_loss, number, German personnel lost on the day]
      - [6, german_cum_losses, number, German cumulative losses]
      - [7, german_survivors, number, German survivors]
      - [8, allied_ashore, number, British personnel ashore]
      - [9, allied_landings, number, "British personnel landed (negative: withdrawn)"]
      - [10, allied_loss, number, British personnel lost on the day]
      - [11, allied_cum_losses, number, British cumulative losses]
      - [12, allied_survivors, number, British survivors remaining on the island]
