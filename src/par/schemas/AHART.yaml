    title: Artillery expenditures by selected US units, World War II to Vietnam
    description: >-
      Blank fields and codes such as UNSP mean unknown; -1 in tube_quantity and rounds_per_tube_day
      is kept as in the source. The diskette README gives a record length of 344 including CRLF, so
      misc holds 55 characters rather than the listed 57. The catalog counts 3,594 records; the
      files hold 3,595.
