source: IWOJIMA
dataset: IWOJIMA-1993
export: IWOJIMA.csv
citation_rows: [1, 10]
notes_rows: [12, 14]
extra_notes_rows: [58, 66]
tables:
  - name: iwojima
    title: Iwo Jima daily strengths and losses, 19 Feb to 27 Mar 1945
    description: The USMC cumulative loss and survivor columns failed in the 2013 export.
    rows: [18, 54]
    keys: [day_number]
    missing: ["#VALUE!"]
    controls:
      - {row: 56, label: Totals, columns: {4: usmc_landings, 5: usmc_loss}}
    columns:
      - [0, day_number, integer, Day number]
      - [1, note, integer, Note number]
      - [2, date, date, Date]
      - [3, d_day_plus, integer, Day relative to D-Day]
      - [4, usmc_landings, number, USMC landed]
      - [5, usmc_loss, number, USMC lost on the day]
      - [6, usmc_cum_losses, number, USMC cumulative losses]
      - [7, usmc_survivors, number, USMC survivors on the island]
      - [8, japanese_ashore, number, Japanese survivors ashore]
      - [9, calc_us_strength, number, Estimated US surviving strength]
      - [10, calc_japanese_strength, number, Estimated Japanese surviving strength]
