[project]
name = "par"
version = "1.0.0"
description = "Personnel Attrition Rates (PAR) data disk: tidy tables, a Frictionless data package, and a Zenodo archive."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "dvc[gs]>=3.67.1",
    "duckdb>=1.1",
    "frictionless>=5.18",
    "llama-cloud>=1.0",
    "pyarrow>=18",
    "pyyaml>=6",
]

[project.scripts]
par-zenodo-upload = "par.zenodo:main"

[dependency-groups]
dev = ["pytest>=8", "deptry>=0.25.1", "ruff>=0.17.2", "ty>=0.0.91"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/par"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PT", "NPY", "PD", "PTH", "RET", "ARG",
    "PL", "TRY", "PERF", "FURB", "S", "DTZ", "N",
]
ignore = [
    "N803",     # argument names like X, N, K, Sigma are standard notation
    "N806",     # so are variable names
    "PLR0913",  # estimators take many arguments
    "PLR2004",  # 0.05, 1.96 and friends are fine as literals
    "S311",     # `random` drives simulations, not cryptography
    "TRY003",   # long exception messages are fine
    "PD011",    # misfires on xarray and NumPy `.values`
    "RUF001",   # prose and labels use γ, ×, – on purpose
    "RUF002",
    "RUF003",
    "S608",     # SQL here is built from paths and schema checks in this repo, not from user input
    "DTZ007",   # dates in historical data have no time zone
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ARG"]
"*.ipynb" = ["B018", "E402"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true


[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true


[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["par"]

[tool.deptry.per_rule_ignores]
# dvc is the pipeline runner, not an import.
DEP002 = ["dvc"]
